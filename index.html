<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tomo Ueda</title>
  <meta name="description" content="Tomo Ueda - software engineer." />
  <meta name="theme-color" content="#0f1417" />
  <meta property="og:title" content="Tomo Ueda" />
  <meta property="og:description" content="Software engineer." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tomoueda.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f7f4;
      --ink: #1c1f20;
      --muted: #727a80;
      --accent: #5f7e72;
      --maxw: 760px;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      min-height: 100%;
    }
    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #f2f0eb 0%, transparent 48%),
        radial-gradient(circle at 85% 100%, #edf2ee 0%, transparent 36%),
        var(--bg);
      padding: clamp(28px, 7vw, 92px) 22px;
    }
    .page {
      width: min(var(--maxw), 100%);
      margin: 0 auto;
      animation: settle 650ms ease both;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 54px);
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .stack {
      margin-top: clamp(28px, 5vw, 42px);
      display: grid;
      gap: clamp(24px, 4vw, 36px);
    }
    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease, color 180ms ease;
    }
    .contact-email {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .contact-email img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      opacity: 0.9;
    }
    .links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .companies {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
    }
    .company {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
    }
    .company img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      opacity: 0.9;
    }
    @keyframes settle {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (max-width: 560px) {
      .companies {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Tomo Ueda</h1>
    <section class="stack">
      <div>
        <ul class="links">
          <li>
            <a class="contact-email" href="mailto:tueda14@gmail.com">
              <img src="https://cdn.simpleicons.org/gmail/1c1f20" alt="Email icon" loading="lazy" />
              <span>tueda14@gmail.com</span>
            </a>
          </li>
          <li><a href="https://www.linkedin.com/in/tomo-ueda/" target="_blank" rel="noopener noreferrer">https://www.linkedin.com/in/tomo-ueda/</a></li>
        </ul>
      </div>
      <div>
        <ul class="companies" aria-label="Companies I have worked at">
          <li class="company">
            <img src="https://cdn.simpleicons.org/notion/1c1f20" alt="Notion logo" loading="lazy" />
            <span>Notion</span>
          </li>
          <li class="company">
            <img src="https://cdn.simpleicons.org/discord/1c1f20" alt="Discord logo" loading="lazy" />
            <span>Discord</span>
          </li>
          <li class="company">
            <img src="https://cdn.simpleicons.org/google/1c1f20" alt="Google logo" loading="lazy" />
            <span>Google</span>
          </li>
          <li class="company">
            <img src="https://cdn.simpleicons.org/uber/1c1f20" alt="Uber logo" loading="lazy" />
            <span>Uber Freight</span>
          </li>
          <li class="company">
            <img src="https://cdn.simpleicons.org/uber/1c1f20" alt="Uber logo" loading="lazy" />
            <span>Uber</span>
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
