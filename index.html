<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tomo Ueda</title>
  <meta name="description" content="Tomo Ueda - software engineer." />
  <meta name="theme-color" content="#0f1417" />
  <meta property="og:title" content="Tomo Ueda" />
  <meta property="og:description" content="Software engineer." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tomoueda.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f7f4;
      --ink: #1c1f20;
      --muted: #727a80;
      --line: #dfdcd4;
      --panel: rgba(255, 255, 255, 0.5);
      --accent: #5f7e72;
      --maxw: 900px;
      --radius: 18px;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      min-height: 100%;
    }
    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #f2f0eb 0%, transparent 48%),
        radial-gradient(circle at 85% 100%, #edf2ee 0%, transparent 36%),
        var(--bg);
      padding: clamp(28px, 7vw, 92px) 22px;
    }
    .page {
      width: min(var(--maxw), 100%);
      margin: 0 auto;
      animation: settle 650ms ease both;
    }
    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(6px);
      padding: clamp(24px, 4vw, 44px);
      box-shadow: 0 20px 42px rgba(17, 19, 21, 0.05);
    }
    .eyebrow {
      margin: 0;
      font-family: "Space Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 10px 0 14px;
      font-size: clamp(28px, 5.5vw, 48px);
      line-height: 1;
      letter-spacing: -0.025em;
    }
    .grid {
      margin-top: 24px;
      display: grid;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      animation: fade-up 550ms ease both;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 12px;
      font-family: "Space Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .links a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease, color 180ms ease;
    }
    .links a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .current {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
      color: var(--muted);
    }
    .current b {
      color: var(--ink);
      font-weight: 600;
    }
    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    @keyframes settle {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (min-width: 720px) {
      .grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }
      .panel:last-child {
        animation-delay: 90ms;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Software Engineer</p>
      <h1>Tomo Ueda</h1>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Contact</h2>
        <ul class="links">
          <li><a href="mailto:tueda14@gmail.com">tueda14@gmail.com</a></li>
          <li><a href="https://www.linkedin.com/in/tomo-ueda/" target="_blank" rel="noopener noreferrer">https://www.linkedin.com/in/tomo-ueda/</a></li>
        </ul>
      </article>
      <article class="panel">
        <h2>Focus</h2>
        <ul class="current">
          <li><b>Building</b> fast, reliable web products.</li>
          <li><b>Improving</b> developer workflows with AI.</li>
          <li><b>Writing</b> occasional notes on engineering.</li>
        </ul>
      </article>
    </section>

    <footer>&copy; <span id="year"></span> Tomo Ueda</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
